set_schedule_day:
  name: Set schedule day
  description: >
    Update one mowing time slot for a weekday. Multiple slots per day are
    supported — use the slot parameter (0, 1, 2, …) to address each slot
    individually. New slots are added automatically when slot index exceeds
    the existing count. The schedule only applies in auto mode.
    The mower must be docked — the device rejects schedule changes
    while an active task is running.
  fields:
    entity_id:
      name: Entity
      description: "Lawn mower entity to target (optional if only one mower is configured)"
      required: false
      selector:
        entity:
          domain: lawn_mower
    week:
      name: Weekday
      description: "0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday"
      required: true
      selector:
        number:
          min: 0
          max: 6
          mode: box
    slot:
      name: Slot
      description: >
        Time slot index for this day (0-based). Default 0 = first slot.
        Set slot: 1 to add or update a second mowing window on the same day.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box
    enabled:
      name: Enabled
      description: "Enable this time slot"
      required: true
      selector:
        boolean:
    start_time:
      name: Start time
      description: "Mowing start time (24h format, e.g. '10:00')"
      required: true
      example: "10:00"
      selector:
        time:
    end_time:
      name: End time
      description: "Mowing end time (24h format, e.g. '20:30')"
      required: true
      example: "20:30"
      selector:
        time:
